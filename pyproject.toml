[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickappstest"
version = "1.0.0"
description = "Shared UI and behavior test library for Quick-series Windows apps."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "maktak-105", email = "maktak-105@users.noreply.github.com" }]
dependencies = [
    "playwright>=1.45",
    "pywinauto>=0.6.8",
    "Appium-Python-Client>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/maktak-105/QuickAppsTest"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a built Quick EXE"]
